<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <style>
      .compass { fill: #1a2847; }
      .accent { fill: #8b2735; }
      .gold { fill: #c5a572; }
      .text { fill: #1a2847; font-family: Georgia, serif; font-style: italic; }
    </style>
  </defs>
  <g transform="translate(200, 200)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="#c5a572" stroke-width="2" stroke-dasharray="5,5"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#1a2847" stroke-width="3"/>
    <path d="M 0,-160 L 10,0 L 0,20 L -10,0 Z" class="compass"/>
    <path d="M 0,160 L 10,0 L 0,-20 L -10,0 Z" class="gold"/>
    <path d="M 160,0 L 0,10 L -20,0 L 0,-10 Z" class="accent"/>
    <path d="M -160,0 L 0,10 L 20,0 L 0,-10 Z" class="gold"/>
    <circle cx="0" cy="0" r="8" class="accent"/>
    <circle cx="-70" cy="-70" r="3" class="gold"/>
    <circle cx="70" cy="-70" r="3" class="gold"/>
    <circle cx="-70" cy="70" r="3" class="accent"/>
    <circle cx="70" cy="70" r="3" class="accent"/>
  </g>
  <text x="500" y="220" font-size="120" font-weight="600" class="text">Portulan</text>
</svg>